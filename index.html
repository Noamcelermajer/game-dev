<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>game-dev arcade</title>
  <style>
    :root {
      --bg: #101114;
      --surface: #1a1c21;
      --border: #2c2f36;
      --text: #ececf1;
      --muted: #9a9ea8;
      --accent: #7dd3a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { margin: 0 0 32px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
    .card h2 { margin: 0 0 6px; font-size: 18px; }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); }
    .empty { color: var(--muted); }
    code { background: var(--surface); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>game-dev arcade</h1>
    <p class="sub">Vibe-coded games, one folder each.</p>
    <div id="games" class="grid"></div>
  </main>
  <script>
    const root = document.getElementById('games');

    function empty(msg) {
      root.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'empty';
      p.innerHTML = msg;
      root.appendChild(p);
    }

    fetch('games.json')
      .then(r => r.json())
      .then(games => {
        if (!games.length) {
          empty('No games yet. Run <code>node scripts/new-game.mjs my-game "My Game"</code> to add one.');
          return;
        }
        for (const g of games) {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = `games/${g.slug}/`;
          const h = document.createElement('h2');
          h.textContent = g.title;
          const p = document.createElement('p');
          p.textContent = g.description || '';
          const tags = document.createElement('div');
          tags.className = 'tags';
          for (const t of g.tags || []) {
            const s = document.createElement('span');
            s.className = 'tag';
            s.textContent = t;
            tags.appendChild(s);
          }
          a.append(h, p, tags);
          root.appendChild(a);
        }
      })
      .catch(() => empty('Could not load games.json. Serve this folder over HTTP (for example <code>npx serve .</code>).'));
  </script>
</body>
</html>
